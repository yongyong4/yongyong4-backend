spring:
  application:
    name: yongyong-be

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

odsay:
  api-key: ${ODSAY_API_KEY:}

kakao:
  rest-api-key: ${KAKAO_REST_API_KEY:}

springdoc:
  swagger-ui:
    tags-sorter: alpha
