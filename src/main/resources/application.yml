spring:
  application:
    name: yongyong-be
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/yongyong?connectionTimeZone=Asia/Seoul}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

odsay:
  api-key: ${ODSAY_API_KEY:}

kakao:
  rest-api-key: ${KAKAO_REST_API_KEY:}
