spring:
  application:
    name: yongyong-be
  web:
    error:
      # 400 응답에 잘못된 입력 이유를 보여준다
      include-message: always
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/yongyong?connectionTimeZone=Asia/Seoul}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

odsay:
  api-key: ${ODSAY_API_KEY:}

kakao:
  rest-api-key: ${KAKAO_REST_API_KEY:}

springdoc:
  swagger-ui:
    tags-sorter: alpha
